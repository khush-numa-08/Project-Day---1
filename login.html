</head>
<body>

<form method="post" onsubmit="handlelogin(); return false;">

	Password: <input type="password" id="pass" name="password"><br><br>

	<script>

		const pass = document.getElementById('pass');

			const username = user.value;
			const password = pass.value;

			if(username == 'admin'){
				if(password == 'admin'){
					alert("Login Successful...")
					window.location.href = 'file:///C:/Users/Khushnuma/Desktop/Khushnuma%20VS%20Code/JavaScript/07-login/marksheet.html';
				}else{
					alert("Wrong Password");
				}
			}else{
				alert("Wrong User ID")
			}
		}


	</script>

</body>
</html>
