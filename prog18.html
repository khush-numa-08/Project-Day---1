<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ladder If-else</title>
</head>
<body>
	<script>
		let a = 10;
		let b = 20;
		let c = 30;
		let d = 40;

	if(a >= b && a >= c && a >= d){

		console.log("a is Max");

	}else if(b >= c && b >= d){

		console.log("b is Max");

	}else if(c >= d){

		console.log("c is Max");

	}else{

		console.log("d is Max");
	
	}

</script>
</body>
</html>
