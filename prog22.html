<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Switch Vowel</title>
</head>
<body>
<script>
	let vo = 'a';

	switch(vo)
	{
		case 'A':
		case 'E':
		case 'I':
		case 'O':
		case 'U':
		case 'a':
		case 'e':
		case 'i':
		case 'o':
		case 'u':
			console.log("Vowel")
			break;
		default:
			console.log("Not Vowel");								
	}

</script>
</body>
</html>
