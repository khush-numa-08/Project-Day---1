<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nested If-else</title>
</head>
<body>
	<script>
		let a = 10;
		let b = 20;
		let c = 30;

		if(a >= b){

			if(a >= c){

				console.log("a is Max");

			}
			else{

				console.log("c is Max");

			}
		}
		else
		{
			if(b >= c){

				console.log("b is Max");

			}
			else{

				console.log("c is Max");

			}
		}

</script>
</body>
</html>
