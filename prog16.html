<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>If-else</title>
</head>
<body>
	<script>
		let a = 10;
		let b = 20;

	if(a >= b){

		console.log("a is Max");

	}
	else
	{

		console.log("b is Max");

	}
	</script>
</body>
</html>
